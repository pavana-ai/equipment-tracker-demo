<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Vessel Equipment Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: navy ops header band + tab strip, single working column of lists; detail opens as a side sheet (full screen on phones). */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e4eaef; --ink:#0f1e2b; --muted:#566878; --line:#d3dce3;
  --navy:#12324a; --navy-ink:#eaf2f8; --navy-muted:#9db6ca;
  --accent:#d9561a; --accent-ink:#ffffff;
  --ok:#1d7f47; --warn:#a96b0c; --bad:#bb3326; --info:#2a6894; --idle:#66727e;
  --label-bg:#ffffff; --label-ink:#000000;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b141b; --surface:#13202a; --sunk:#0f1a22; --ink:#e3ebf1; --muted:#90a3b2; --line:#233541;
  --navy:#0e2433; --navy-ink:#e3ebf1; --navy-muted:#86a2b8;
  --accent:#ff7a38; --accent-ink:#1a0b02;
  --ok:#4fc283; --warn:#e3a849; --bad:#f06a5a; --info:#6eaed9; --idle:#98a5b1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b141b; --surface:#13202a; --sunk:#0f1a22; --ink:#e3ebf1; --muted:#90a3b2; --line:#233541;
  --navy:#0e2433; --navy-ink:#e3ebf1; --navy-muted:#86a2b8;
  --accent:#ff7a38; --accent-ink:#1a0b02;
  --ok:#4fc283; --warn:#e3a849; --bad:#f06a5a; --info:#6eaed9; --idle:#98a5b1;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;margin:0;line-height:1.1}
.brand .sub{font-size:12px;color:var(--navy-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sitepick{position:relative;display:inline-flex}.sitepick .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#siteSel{background:color-mix(in srgb,var(--navy-ink) 9%,transparent);color:var(--navy-ink);border:1px solid color-mix(in srgb,var(--navy-ink) 30%,transparent);border-radius:6px;padding:3px 26px 3px 8px;font-size:13px;font-weight:600;max-width:100%}
#siteSel option{color:#0f1e2b;background:#fff}
.demo-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:3px;font-weight:600}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--navy-ink) 25%,transparent);background:color-mix(in srgb,var(--navy-ink) 7%,transparent);color:var(--navy-ink);border-radius:999px;padding:6px 12px 6px 10px;font-size:12.5px}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.sync.off .dot{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 30%,transparent)}
.sync.busy .dot{background:var(--info);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--navy-ink) 25%,transparent);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--navy-muted);padding:4px 11px;border-radius:999px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy)}
nav.tabs{overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:2px;min-width:max-content}
.tabs a{display:block;padding:10px 12px 11px;color:var(--navy-muted);text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--navy-ink)}
.tabs a[aria-current="page"]{color:var(--navy-ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--f-mono);font-size:11px;margin-left:5px;opacity:.75}

main{padding-block:20px 48px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance;letter-spacing:.005em}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;letter-spacing:.01em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:14px 16px}

/* Demo guide */
.guide{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 16px;border:1px dashed color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.guide b{font-family:var(--f-display);font-size:16px;font-weight:700}
.guide ol{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}
.guide .x{grid-column:1/-1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .n{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.alert .n{color:var(--bad)}
.kpi.pend .n{color:var(--warn)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* status bar */
.stackbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stackbar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:7px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:2px;flex:none}
.legend .mono{margin-left:auto}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bar-row .t{height:10px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar-row .t span{display:block;height:100%;background:var(--info);border-radius:3px}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .mono{text-align:right}

/* attention */
.att-group+.att-group{border-top:1px solid var(--line)}
.att-group>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer}
.att-group>summary::-webkit-details-marker{display:none}
.att-group>summary .sev{width:4px;align-self:stretch;border-radius:2px}
.att-group>summary .ttl{font-weight:600;flex:1}
.att-group>summary .mono{font-weight:600}
.att-group>summary::after{content:"›";color:var(--muted);transition:transform .15s}
.att-group[open]>summary::after{transform:rotate(90deg)}
.att-list{padding:0 16px 10px 30px;display:grid;gap:2px}
.att-item{display:flex;gap:10px;align-items:baseline;justify-content:space-between;text-align:left;background:none;border:0;padding:5px 6px;border-radius:5px;width:100%}
.att-item:hover{background:var(--sunk)}
.att-item .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-item .w{flex:none;font-size:12.5px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--c,var(--idle));background:color-mix(in srgb,var(--c,var(--idle)) 13%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--idle)) 28%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{--c:var(--ok)}.c-warn{--c:var(--warn)}.c-bad{--c:var(--bad)}.c-info{--c:var(--info)}.c-idle{--c:var(--idle)}

/* toolbar + lists */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 240px;min-width:0;position:relative}
.toolbar .search input{width:100%;padding:9px 12px 9px 34px}
.toolbar .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
select{padding-right:28px}
.toolbar select{flex:0 1 auto;max-width:100%}
.result-count{font-size:12.5px;color:var(--muted);margin-left:auto}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(0,190px) 150px;gap:12px;align-items:center;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .id{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--accent)}
.row .main{min-width:0}
.row .main .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .loc{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{justify-self:end;display:flex;gap:6px;align-items:center}
.row.sp{grid-template-columns:92px minmax(0,1fr) minmax(0,190px) 180px}
@media (max-width:760px){
  .row,.row.sp{grid-template-columns:76px minmax(0,1fr);row-gap:4px}
  .row .loc{grid-column:2;font-size:12.5px;color:var(--muted)}
  .row .end{grid-column:2;justify-self:start}
}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.qty button{border:0;background:var(--sunk);width:30px;height:30px;font-size:16px;font-weight:600}
.qty button:hover{background:color-mix(in srgb,var(--accent) 18%,var(--sunk))}
.qty span{min-width:58px;text-align:center;font-family:var(--f-mono);font-size:13px;padding:0 6px}
.qty.low span{color:var(--bad);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{padding:14px 20px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* drawer */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px color-mix(in srgb,#000 25%,transparent);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;font-size:18px;flex:none}
.sheet-b{overflow:auto;padding:16px 18px 32px;display:flex;flex-direction:column;gap:16px;flex:1 1 auto;min-height:0}
.sheet-b>*{flex:none}
.idbig{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:13px}
.sheet-h h3{font-size:21px;line-height:1.15;margin-top:2px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{background:var(--surface);padding:8px 11px;min-width:0}
.kv dt{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-family:var(--f-mono)}
.kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.qrbox{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.qrbox .q{background:var(--label-bg);padding:6px;border-radius:4px;flex:none;line-height:0}
.actions{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.act-row{display:flex;gap:8px;flex-wrap:wrap}
.act-row select,.act-row input{flex:1 1 180px}
.locked{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.hist{display:grid;gap:0}
.hist div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.hist div:first-child{border-top:0}

/* activity */
.log-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.log-row:first-child{border-top:0}
.log-row .who{font-size:12.5px;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-family:var(--f-mono);font-weight:600;font-size:12.5px}
@media (max-width:640px){.log-row{grid-template-columns:minmax(0,1fr) auto}.log-row .when{grid-column:1/-1}}

/* scan */
.scan-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.scan-hero{grid-template-columns:minmax(0,1fr)}}
.viewfinder{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);background:var(--navy);display:grid;place-items:center;overflow:hidden}
.viewfinder::before{content:"";position:absolute;inset:18%;border:2px solid color-mix(in srgb,var(--navy-ink) 35%,transparent);border-radius:10px}
.viewfinder .scanline{position:absolute;left:18%;right:18%;height:2px;background:var(--accent);top:30%;animation:sweep 2.4s ease-in-out infinite alternate;box-shadow:0 0 12px var(--accent)}
@keyframes sweep{to{top:70%}}
@media (prefers-reduced-motion:reduce){.viewfinder .scanline{animation:none;top:50%}.sync.busy .dot{animation:none}}
.viewfinder .inner{position:relative;z-index:1;display:grid;gap:10px;justify-items:center;text-align:center;color:var(--navy-ink);padding:16px}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sample{display:grid;gap:8px;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sample .q{background:var(--label-bg);padding:6px;border-radius:4px;line-height:0}

/* labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.label{aspect-ratio:2/1;max-width:100%;background:var(--label-bg);color:var(--label-ink);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.label .q{line-height:0}
.label .id{font-family:var(--f-mono);font-weight:600;font-size:17px;letter-spacing:.02em}
.label .d{font-size:11.5px;line-height:1.25;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.label .s{font-family:var(--f-mono);font-size:10.5px}
.label .o{font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;border-top:1px solid var(--label-ink);padding-top:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 8px 24px color-mix(in srgb,#000 30%,transparent)}
/* add equipment */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px color-mix(in srgb,#000 30%,transparent);z-index:25;display:none}
@media (max-width:760px){.fab{display:grid;place-items:center}}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice>*{display:grid;gap:6px;justify-items:start;text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.choice>*:hover{border-color:var(--accent)}
.choice b{font-family:var(--f-display);font-size:18px}
.ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
@media (max-width:520px){.choice{grid-template-columns:minmax(0,1fr)}}
.warnbox,.infobox{border-radius:var(--r);padding:10px 12px;font-size:13px;display:grid;gap:6px}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.infobox{border:1px solid color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 9%,var(--surface))}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fgrid label,.fgrid .lab{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.fgrid input,.fgrid select,.fgrid textarea{width:100%;color:var(--ink)}
.fgrid textarea{min-height:64px;resize:vertical}
.fgrid .full{grid-column:1/-1}
.fgrid .chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px}
.fgrid .chk input{width:auto}
.req::after{content:" *";color:var(--bad)}
.fsec{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.sheet.wide{width:min(1120px,100%)}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}

/* reports + builder */

function qrMatrix(text){if(typeof window.qrcode!=="function")return null;try{const q=window.qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();const m=[];for(let r=0;r<n;r++){const row=[];for(let c=0;c<n;c++)row.push(q.isDark(r,c));m.push(row)}return m}catch(e){return null}}
function qrSvg(text,px){const m=qrMatrix(text);const qz=2;
  if(!m)return'<svg width="'+px+'" height="'+px+'" viewBox="0 0 10 10" role="img" aria-label="QR code unavailable"><rect width="10" height="10" fill="#fff" stroke="#000" stroke-width=".3" stroke-dasharray=".6 .6"/><text x="5" y="5.6" font-size="1.6" text-anchor="middle" fill="#000">QR</text></svg>';
  const n=m.length+qz*2;let d="";m.forEach((row,r)=>row.forEach((v,c)=>{if(v)d+="M"+(c+qz)+","+(r+qz)+"h1v1h-1z"}));
  return'<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" role="img" aria-label="QR code for '+esc(text)+'"><rect width="'+n+'" height="'+n+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
function qrCanvas(text){const m=qrMatrix(text);if(!m)return null;const s=8,qz=4,n=m.length+qz*2;const c=document.createElement("canvas");c.width=c.height=n*s;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.fillStyle="#000";m.forEach((row,r)=>row.forEach((v,k)=>{if(v)g.fillRect((k+qz)*s,(r+qz)*s,s,s)}));return c}
function decodeCanvas(c){if(typeof window.jsQR!=="function")return null;const g=c.getContext("2d");const im=g.getImageData(0,0,c.width,c.height);const res=window.jsQR(im.data,im.width,im.height);return res?res.data:null}

const folderById=id=>S.folders.find(f=>f.id===id);
function ensurePath(names){let p=null;names.forEach(n=>{let f=S.folders.find(x=>x.parent===p&&x.name===n);
  if(!f){f={id:"F"+(S.seq++),name:n,parent:p,created:Date.now(),by:"System"};S.folders.push(f)}p=f.id});return p}
function pathOf(fid){const a=[];let f=folderById(fid);while(f){a.unshift(f);f=folderById(f.parent)}return a}
const pathText=fid=>pathOf(fid).map(f=>f.name).join(" › ");
const kidsOf=fid=>S.folders.filter(f=>f.parent===fid).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
const filesIn=fid=>S.files.filter(f=>f.folder===fid).sort((a,b)=>b.created-a.created);
function countDeep(fid){return filesIn(fid).length+kidsOf(fid).reduce((a,k)=>a+countDeep(k.id),0)}
const repFolder=(type,date,client,vessel)=>{const y=(date||iso(TODAY)).slice(0,4);const p=["Reports",vessel||VESSEL,RT[type].folder,y];if(type==="tr")p.push(client||"Unassigned client");return ensurePath(p)};

let dlP=null;
function getDownloads(){if(!dlP){try{dlP=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(()=>null):Promise.resolve(null)}catch(e){dlP=Promise.resolve(null)}}return dlP}
async function downloadDoc(title,type,body){const inClaude=!!(window.claude&&typeof window.claude.use==="function");const dl=inClaude?await getDownloads():null;
  if(!dl){if(inClaude){toast("Downloading isn't available for this viewer.");return}
    const html=fullDocHTML(title,type,body);const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    const w=window.open(url,"_blank");
    if(w){toast("Opened in a new tab. The print window will appear.")}
    else{const a=document.createElement("a");a.href=url;a.download=safeName(title)+".html";document.body.appendChild(a);a.click();a.remove();toast("Saved. Open the file and it goes straight to the print window.")}
    setTimeout(()=>URL.revokeObjectURL(url),60000);return}
  try{await dl.save({filename:safeName(title)+".html",data:fullDocHTML(title,type,body)});toast("Saved. Open the file and it goes straight to the print window.")}
  catch(e){const c=e&&e.code;if(c==="declined")return;if(c==="rate_limited")toast("A download prompt is already open.");else toast("Couldn't save the file in this view.")}}

function nextNo(type,date){const y=(date||iso(TODAY)).slice(0,4);
  if(type==="fr"){const n=S.reports.filter(r=>r.type==="fr").map(r=>parseInt(String(r.no).replace(/\D/g,""),10)||0);return"FR-"+String((n.length?Math.max(...n):45)+1).padStart(3,"0")}
  if(type==="tr"){const job=arguments[2]||"J-0000";const pre=CO.short+"_"+job+"-TR-";const n=S.reports.filter(r=>r.type==="tr"&&String(r.no).indexOf(pre)===0).map(r=>parseInt(r.no.slice(pre.length),10)||0);return pre+String((n.length?Math.max(...n):0)+1).padStart(3,"0")}
  const P="OM";const n=S.reports.filter(r=>r.type===type&&String(r.no).indexOf(P+"-"+y)===0).map(r=>parseInt(r.no.split("-")[2],10)||0);
  return P+"-"+y+"-"+String((n.length?Math.max(...n):0)+1).padStart(3,"0")}
function repTitle(type,d){if(type==="om")return(d.client||"No client")+" – "+(d.pol||"?")+" to "+(d.pod||"?");
  if(type==="fr")return(d.desc||"Equipment")+(d.serial?" SN "+d.serial:"");
  return[(d.client||"Client"),(d.subject||"Project Data")].join(" ")+" To Client"}
function frSnapshot(d){const e=byId(d.itemId);return Object.assign({},d,e?{desc:e.manufacturer+" "+e.description,serial:e.serial,asset:e.assetTag,owner:e.owner,itemId:e.id}:{})}
function snapshot(type,d){if(type==="om")return Object.assign({},d,{lines:omLines(d.ids||[])});
  if(type==="fr")return frSnapshot(d);
  const lines=trLines(d.ids||[],d.client);const o=Object.assign({},d,{lines});o.title=repTitle("tr",o);return o}
function saveReport(type,draft,opt){opt=opt||{};const data=snapshot(type,draft);delete data.ids;
  const rep={id:"R"+(S.seq++),type,no:draft.no,date:draft.date||iso(TODAY),created:opt.at||Date.now(),by:opt.by||"You",data};
  rep.title=repTitle(type,data);
  const folder=repFolder(type,rep.date,data.client,data.vessel);
  const file={id:"D"+(S.seq++),name:type==="tr"?rep.no+" ("+rep.title+")":rep.no+" "+RT[type].label+" – "+rep.title,folder,kind:"report",type,repId:rep.id,created:rep.created,by:rep.by};
  rep.fileId=file.id;S.reports.unshift(rep);S.files.push(file);return rep}

function seedDocs(){S.folders=[];S.files=[];S.reports=[];S.seq=1;
  ["om","fr","tr"].forEach(t=>{const fid=ensurePath(["Templates",RT[t].tpl]);

  S.eq.filter(e=>e.certExp).slice(0,4).forEach((e,i)=>S.files.push({id:"D"+(S.seq++),name:e.id+" "+e.description+" – Calibration Certificate.pdf",folder:cal,kind:"file",created:Date.now()-(20+i*9)*DAY,by:"J. Chen"}));
  const sent=S.eq.filter(e=>e.status==="Sent Back").slice(0,5);
  if(sent.length)saveReport("om",{no:"OM-"+iso(TODAY).slice(0,4)+"-001",date:dOff(-21),consignee:"Demo Marine Services – Shore Base\n1200 Harbor Point Dr\nHouston, TX 77041\nAttn: Workshop",agent:"Gulf Coast Freight Agents",notify:"A. Rivera\nWorkshop Supervisor",client:"Gulfline Energy",vessel:VESSEL,project:"J-2611",invRef:"",pol:"Port Fourchon, LA",pod:"Houston, TX",signName:"A. Rivera",signTitle:"Logistics Coordinator",notes:"Returned for service after project completion.",ids:sent.map(e=>e.id)},{at:Date.now()-21*DAY,by:"A. Rivera"});
  const bad=S.eq.find(e=>e.status==="Defective"&&e.site==="NP");
  if(bad)saveReport("fr",{no:"FR-046",date:dOff(-9),vessel:VESSEL,job:"J-2624",itemId:bad.id,model:"",when:dOff(-10)+"T14:30",fault:bad.notes||"Unit fails to respond",usage:"Mounted on ROV during pipeline survey.",action:"Swapped to spare unit. Faulty unit tagged and moved to workshop.",completedBy:"M. Okafor",checkedBy:"J. Chen"},{at:Date.now()-9*DAY,by:"M. Okafor"});
  const iss=S.hd.filter(h=>h.status==="Issued to Client"&&h.site==="NP");
  if(iss.length){const cl=iss[0].client;const grp=iss.filter(h=>h.client===cl);
    const job=grp[0].job;saveReport("tr",{vessel:VESSEL,no:CO.short+"_"+job+"-TR-001",date:grp[0].issued||dOff(-12),client:cl,toName:"Onboard "+cl+" Representative",recipient:"R. Delgado",toAddr:"",contact:"J. Chen",job,subject:"Pipeline Survey Video",signName:"J. Chen",contents:grp.length+"x hard drive"+(grp.length>1?"s":"")+" containing video and stills recorded during the "+cl+" pipeline survey. ROV DVR and dive logs are also included.",ids:grp.map(h=>h.id)},{at:Date.now()-12*DAY,by:"J. Chen"})}
}

function parseMaker(text){const out={};String(text).split(/[;\n|]/).forEach(part=>{const m=part.match(/^\s*([A-Za-z\/ ]+)\s*[:=]\s*(.+?)\s*$/);if(!m)return;const k=m[1].toUpperCase().replace(/\s/g,"");
  if(/^(SN|S\/N|SERIAL)/.test(k))out.serial=m[2];else if(/^(MFR|MAKE|MANUFACTURER|BRAND)/.test(k))out.manufacturer=m[2];else if(/^(MODEL|PRODUCT|DESC)/.test(k))out.description=m[2];else if(/^(PN|P\/N|PART)/.test(k))out.pn=m[2]});
  if(!out.serial&&!out.manufacturer&&!out.description)out.raw=String(text).trim().slice(0,60);return out}

    if(m.manufacturer){const hit=S.eq.find(e=>e.manufacturer===m.manufacturer&&(!m.description||e.description===m.description));
      if(hit){d.category=hit.category;d.eccn=hit.eccn;d.coo=hit.coo;d.schedB=hit.schedB;d.dims=hit.dims;d.weightLb=hit.weightLb;d.cost=hit.cost}}}
  else if(T==="sp"){d.description=[m.manufacturer,m.description].filter(Boolean).join(" ")||m.raw||d.description;

  panel.step="form";renderPanel()}

function saveDraft(){const p=panel,d=p.draft,t=p.type;
  if(t==="om"){if(!d.ids.length){toast("Pick at least one item for the manifest.");p.view="form";renderPanel();return}if(!d.consignee.trim()){toast("Enter the consignee.");return}}
  if(t==="fr"&&!d.fault.trim()){toast("Describe the fault before saving.");p.view="form";renderPanel();return}
  if(t==="tr"&&!d.ids.length){toast("Pick at least one drive.");p.view="form";renderPanel();return}
  if(S.reports.some(r=>r.type===t&&r.no===d.no)){toast("Number "+d.no+" is already used. Change it before saving.");return}
  const rep=saveReport(t,d,{});
  if(t==="om"&&d.update)d.ids.forEach(id=>{const e=byId(id);if(!e)return;const dest=d.dest||"HOU";const from=siteById(e.site).short+" · "+e.location;if(dest==="HOU")e.status="Sent Back";e.site=dest;e.location="In transit";record(e,"Shipped on "+rep.no,from+" → "+siteName(dest)+" (in transit)")});
  if(t==="fr"){const e=byId(d.itemId);if(e){if(d.mark&&e.status!=="Defective"){const from=e.status;e.status="Defective";e.notes=d.fault;record(e,"Fault reported "+rep.no,from+" → Defective")}else record(e,"Fault reported "+rep.no,d.fault.slice(0,80))}}
  if(t==="tr")d.ids.forEach(id=>{const h=byId(id);if(!h)return;if(d.mark){h.status="Issued to Client";h.client=d.client;h.job=d.job;h.issued=d.date}record(h,"Sent on "+rep.no,d.client+" · "+d.job)});
  save();render();openPanel({kind:"doc",fileId:rep.fileId,justSaved:true})}

function upcoming(days){const out=[];const R=S.remind;

    if(R.overdue&&d0<0){let k=(7-((-d0)%7))%7;for(;k<=days;k+=7)out.push({in:k,c,rd:-1,overdue:true,reason:"Overdue "+(k-d0)+" days · weekly"})}});
  return out.sort((a,b)=>a.in-b.in||(a.c.expires<b.c.expires?-1:1))}

      imp.sheetNames=wb.SheetNames;imp.sheet=pickSheet(wb.SheetNames,imp.type);impLoadRows(name,sheets[imp.sheet],sheets)})).catch(()=>toast("Couldn’t open the Excel file here. Save it as CSV (File › Save As › CSV) and try again."));return}

function impRun(){const T=imp.type,site=imp.site;const batch={id:"I"+(S.seq++),file:imp.file,type:T,site,at:Date.now(),by:"You",created:[],merged:[],skipped:0};
  imp.checked.forEach(r=>{if(!r.on){batch.skipped++;return}const R=r.rec;let it;
    if(T==="sp"&&R.mergeInto){const ex=byId(R.mergeInto);ex.qty+=+R.qty||0;batch.merged.push([ex.id,+R.qty||0]);record(ex,"Quantity changed","+"+(R.qty||0)+" "+ex.unit+" from "+imp.file);return}
    const id=R.id&&!byId(R.id)?R.id:nextIdFor(T);
    if(T==="eq"){it={type:"eq",id,site,category:R.category,manufacturer:R.manufacturer||"Unknown",description:R.description,serial:R.serial,assetTag:R.assetTag,status:R.status,location:R.location,caseLoc:R.caseLoc||"No case",owner:R.owner||"Company",verified:R.verified||iso(TODAY),certExp:"",
      cost:+R.cost||0,eccn:R.eccn||"EAR99",coo:R.coo||COO[R.manufacturer]||"",schedB:R.schedB||SCHEDB[R.category]||"",dims:(PACK[R.category]||[""])[0],weightLb:(PACK[R.category]||["",""])[1]||"",notes:R.notes};S.eq.push(it);
      if(R.certExp)newCert(it,R.category==="Lifting Gear"?"Load test":"Calibration",R.certExp)}
    else if(T==="sp"){it={type:"sp",id,site,kind:R.kind,description:R.description,unit:R.unit,min:+R.min||0,qty:+R.qty||0,location:R.location,box:R.box||"—"};S.sp.push(it)}
    else{it={type:"hd",id,site,manufacturer:R.manufacturer||"Unknown",size:R.size||"—",serial:R.serial,status:R.status,job:R.job,client:R.client,dataDesc:R.dataDesc,issued:R.issued||(R.status==="Issued to Client"?iso(TODAY):"")};S.hd.push(it)}
    batch.created.push(id);S.log.unshift({id:"L"+Date.now()+Math.random().toString(36).slice(2,6),at:Date.now(),who:"You",ref:id,what:"Imported",detail:imp.file+" · row "+r.n,synced:false})});
  S.imports.unshift(batch);save();if(S.online)scheduleSync();imp.step=4;render();toast("Imported "+batch.created.length+" record"+(batch.created.length===1?"":"s")+".")}
function impUndo(id){const b=S.imports.find(x=>x.id===id);if(!b||b.undone)return;const set=new Set(b.created);
  S.eq=S.eq.filter(x=>!set.has(x.id));S.sp=S.sp.filter(x=>!set.has(x.id));S.hd=S.hd.filter(x=>!set.has(x.id));S.certs=S.certs.filter(c=>!set.has(c.itemId));
  b.merged.forEach(([mid,q])=>{const x=byId(mid);if(x)x.qty=Math.max(0,x.qty-q)});b.undone=true;save();if(imp.step===4)impReset(true);render();toast("Import undone. "+b.created.length+" record"+(b.created.length===1?"":"s")+" removed.")}
const csvCell=v=>{const t=String(v==null?"":v);return/[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
async function saveFile(filename,data,mime){const inClaude=!!(window.claude&&typeof window.claude.use==="function");const dl=inClaude?await getDownloads():null;
  if(dl){try{await dl.save({filename,data});toast("Saved "+filename)}catch(e){const c=e&&e.code;if(c!=="declined")toast("Couldn't save the file in this view.")}return}
  if(inClaude){toast("Downloading isn't available for this viewer.");return}
  const url=URL.createObjectURL(new Blob([data],{type:mime||"text/csv"}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast("Saved "+filename)}
function exportCSV(kind){const stamp=iso(TODAY);const sn=fleet()?"All vessels":siteById(S.site).short;let head,rows;
  if(kind==="certs"){head=["Item ID","Item","Serial","Vessel / site","Certificate","Certificate no","Issued","Expires","Issued by","Status"];rows=CERTS().map(c=>{const it=byId(c.itemId);return[it.id,it.manufacturer+" "+it.description,it.serial,siteName(it.site),c.type,c.certNo,c.issued,c.expires,c.issuer,certState(c)[0]]})}
  else{const F=IMP_FIELDS[kind];head=F.map(f=>f[1]).concat(["Vessel / site"]);const list=kind==="eq"?EQ():kind==="sp"?SP():HD();
    rows=list.map(x=>F.map(f=>f[0]==="id"?x.id:x[f[0]]).concat([siteName(x.site)]))}
  const csv="﻿"+[head].concat(rows).map(r=>r.map(csvCell).join(",")).join("\r\n");
  saveFile(((kind==="certs"?"Certificates":TYPE_TXT[kind])+" - "+sn+" - "+stamp).replace(/[^A-Za-z0-9 ._-]/g,"")+".csv",csv,"text/csv")}

  if(kind==="move"){const to=val("aLoc");if(to===it.location){toast("It's already in "+to);return}const from=it.location;it.location=to;record(it,"Moved",from+" → "+to);if(S.online)toast("Moved "+it.id+" to "+to)}
  else if(kind==="status"){const to=val("aSt");if(to===it.status)return;const from=it.status;it.status=to;record(it,"Status changed",from+" → "+to)}
  else if(kind==="verify"){it.verified=iso(TODAY);if(it.status==="Needs Verification")it.status="In Service";record(it,"Verified on board","Seen at "+it.location)}
  else if(kind==="note"){const t=val("aNote").trim();if(!t)return;it.notes=t;record(it,"Note added",t)}
  else if(kind==="issue"){const c=val("aCl");it.status="Issued to Client";it.client=c;it.issued=iso(TODAY);if(!it.job)it.job="J-26"+String(50+S.log.length%40);record(it,"Issued to client",c+" · "+it.job)}
  else if(kind==="return"){it.status="On Hand";it.issued="";record(it,"Returned","Back on board from "+it.client)}
  else if(kind==="missing"){const from=it.status;it.status="Missing";record(it,"Reported missing","Was "+from)}
  else if(kind==="found"){it.status="On Hand";record(it,"Found","Located on board")}
  else if(kind==="transfer"){const to=val("aSite");if(!to||to===it.site)return;const from=it.site;it.site=to;it.location=locsFor(to)[0];record(it,"Transferred",siteName(from)+" → "+siteName(to));save();
    if(!fleet()&&S.site!==to){closeSheet();refreshList();toast(it.id+" transferred to "+siteName(to)+". It now shows under that vessel.");return}toast(it.id+" transferred to "+siteName(to))}
  else if(kind==="reuse"){const nid=nextIdFor("hd");const n={type:"hd",id:nid,site:it.site,manufacturer:it.manufacturer,size:it.size,serial:it.serial,status:"On Hand",job:"",client:"",dataDesc:"Blank",issued:""};
    S.hd.push(n);it.status="Reformatted";it.reusedAs=nid;record(it,"Reformatted",it.dataDesc+" wiped · reused as "+nid);record(n,"Reformatted for reuse","Same drive as "+it.id);
    save();refreshList();openSheet(nid);toast(it.id+" closed. The drive is now "+nid+". Stick its new label on the drive.");return}
  save();refreshSheet();refreshList();}
function bumpQty(id,d){const s=byId(id);if(!s||!editor())return;const from=s.qty;s.qty=Math.max(0,s.qty+d);if(s.qty===from)return;
  record(s,"Quantity changed",from+" → "+s.qty+" "+s.unit+(d<0?" (used)":" (restocked)"));save();refreshList();refreshSheet();}

/* ---------- scanning ---------- */
function handleScan(code,how){const id=idFromCode(code);if(!id){toast(editor()?"That code isn't one of our labels. Use the + button on Equipment, Supplies or Hard drives to add a new item.":"That QR code isn't one of our labels.");return}
  if(!byId(id)){if(editor()){openAdd({form:true,how:"Scanned blank label",draft:{assignId:id},note:"Label <b class=\"mono\">"+id+"</b> isn't in the database yet. Fill in the details to add it."},{EQ:"eq",SP:"sp",HD:"hd"}[id.slice(0,2)]);return}toast("Label "+id+" isn't in the database.");return}toast((how||"Scanned")+" "+id);openSheet(id)}
function scanPhoto(file){if(typeof window.jsQR!=="function"){toast("The scanner couldn't load. Type the ID instead.");return}
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const max=1400,k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const r=decodeCanvas(c);
    if(r)handleScan(r,"Scanned");else toast("No QR code found. Fill the frame with the label and try again.")};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Couldn't read that photo. Try again.")};img.src=url}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const t=e.target;
  {
  const sc=t.closest("[data-site]");if(sc){setSite(sc.dataset.site);return}
  const cv=t.closest("[data-cview]");if(cv){S.certView=cv.dataset.cview;save();render();return}
  const rn=t.closest("[data-renew]");if(rn){renewCert(rn.dataset.renew);return}
  const ac=t.closest("[data-addcert]");if(ac){const it=byId(ac.dataset.addcert);const ty=(document.getElementById("ncType")||{}).value||"Calibration";const ex=(document.getElementById("ncExp")||{}).value;if(!ex){toast("Pick the expiry date.");return}
    const c=newCert(it,ty,ex);record(it,"Certificate added",ty+" · expires "+fmtD(ex));save();refreshSheet();toast(ty+" certificate added.");return}
  const em=t.closest("[data-email]");if(em){const v=em.dataset.email;if(v==="summary")openPanel({kind:"email",summary:true});else{const p=v.split("|");openPanel({kind:"email",certId:p[0],rd:+p[1],overdue:p[2]==="1",in:+p[3]})}return}
  const rd=t.closest("[data-rm-day]");if(rd&&editor()){const d=+rd.dataset.rmDay;S.remind.days=S.remind.days.filter(x=>x!==d);save();render();return}
  const gd=t.closest("[data-g-del]");if(gd&&editor()){S.groups=S.groups.filter(g=>g.id!==gd.dataset.gDel);save();render();toast("Group removed.");return}
  const gr=t.closest("[data-g-rm]");if(gr&&editor()){const [gid,m]=gr.dataset.gRm.split("|");const g=S.groups.find(x=>x.id===gid);if(g)g.members=g.members.filter(x=>x!==m);save();render();return}
  const is=t.closest("[data-imp-sample]");if(is){impLoadRows(TYPE_TXT[imp.type].toLowerCase().replace(" ","-")+"-sample.csv",parseCSV(IMP_SAMPLES[imp.type]()));return}
  const itp=t.closest("[data-imp-template]");if(itp){saveFile(TYPE_TXT[imp.type]+" import template.csv","﻿"+IMP_FIELDS[imp.type].map(f=>csvCell(f[1])).join(",")+"\r\n","text/csv");return}
  const ib=t.closest("[data-imp-back]");if(ib){imp.step=imp.step===3?2:1;render();return}
  const ick=t.closest("[data-imp-check]");if(ick){impCheck();imp.step=3;imp.only=imp.checked.some(r=>r.iss.length);render();return}
  const igo=t.closest("[data-imp-go]");if(igo){impRun();return}
  const iu=t.closest("[data-imp-undo]");if(iu){impUndo(iu.dataset.impUndo);return}
  const inw=t.closest("[data-imp-new]");if(inw){impReset(true);render();return}
  const iv=t.closest("[data-imp-view]");if(iv){S.site=iv.dataset.impView;S.f={q:"",cat:"",st:"",loc:""};S.fs={q:"",kind:""};S.fh={q:"",st:""};save();impReset(true);return}
  const ex=t.closest("[data-export]");if(ex){exportCSV(ex.dataset.export);return}
  }

  const nr=t.closest("[data-new-report]");if(nr){openReport(nr.dataset.newReport,nr.dataset.item);return}
  const tp=t.closest("[data-tpl]");if(tp){const f=S.files.find(x=>x.kind==="template"&&x.type===tp.dataset.tpl);if(f)openFile(f.id);return}
  const of=t.closest("[data-open-file]");if(of){openFile(of.dataset.openFile);return}
  const fo=t.closest("[data-folder]");if(fo){S.docFolder=fo.dataset.folder||null;newFolderOpen=false;save();render();return}
  const gf=t.closest("[data-goto-folder]");if(gf){S.docFolder=gf.dataset.gotoFolder;save();closeSheet();if(tab!=="documents")location.hash="documents";else render();return}
  const nf=t.closest("[data-newfolder]");if(nf){newFolderOpen=nf.dataset.newfolder==="1";render();const i=document.getElementById("nfName");if(i)i.focus();return}
  const ae=t.closest("[data-add-eq]");if(ae){openAdd(null,ae.dataset.addEq==="1"?"eq":ae.dataset.addEq);return}
  const am=t.closest("[data-add-mode]");if(am&&panel){if(am.dataset.addMode==="manual"){panel.step="form";panel.how="Manual entry";panel.note=""}else{panel.step="choose";panel.confirm=false}renderPanel();return}
  const as=t.closest("[data-add-sample]");if(as&&panel){const txt=as.dataset.addSample==="mfr"?ADD[panel.addType].mfrSample:blankSampleId(panel.addType);const cv=qrCanvas(txt);const r=cv&&decodeCanvas(cv);handleAddCode(r||txt);return}
  const asv=t.closest("[data-add-save]");if(asv){addSave();return}
  const bv=t.closest("[data-bview]");if(bv&&panel){panel.view=bv.dataset.bview;renderPanel();return}
  const sr=t.closest("[data-save-report]");if(sr){saveDraft();return}
  const pr=t.closest("[data-print]");if(pr&&panel&&panel.print){downloadDoc(panel.print.title,panel.print.type,panel.print.body);return}
  const q=t.closest("[data-q]");if(q){e.stopPropagation();bumpQty(q.dataset.id,+q.dataset.q);return}
  const c=t.closest("[data-close]");if(c){closeSheet();return}
  const a=t.closest("[data-act]");if(a){act(a.dataset.act);return}
  const sc=t.closest("[data-scan]");if(sc){const cv=qrCanvas(sc.dataset.scan);const r=cv&&decodeCanvas(cv);if(r)handleScan(r,"Scanned");else{toast("Scanner library unavailable here, opening by ID.");openSheet(sc.dataset.scan)}return}
  const o=t.closest("[data-open]");if(o){openSheet(o.dataset.open);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(openId||panel))closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".row[role=button]")){e.preventDefault();openSheet(e.target.dataset.open)}});
document.addEventListener("input",e=>{const id=e.target.id,tg=e.target;
  if(id==="cq"){S.fc.q=tg.value;certRows();return}
  if(panel&&panel.kind==="report"&&tg.dataset.f&&tg.type!=="checkbox"&&tg.tagName!=="SELECT"){const k=tg.dataset.f;panel.draft[k]=tg.value;
    if(panel.type==="tr"){if(k==="contents")panel.draft.autoContents=!tg.value.trim();if(k==="subject")syncTr()}updatePreview();return}
  if(tg.dataset.pickq!=null){const q=tg.value.toLowerCase().trim();document.querySelectorAll("#pickList .pick-row").forEach(r=>r.hidden=!!q&&r.dataset.txt.indexOf(q)<0);return}
  if(panel&&panel.kind==="add"&&tg.dataset.a&&tg.type!=="checkbox"&&tg.tagName!=="SELECT"){panel.draft[tg.dataset.a]=tg.value;if(["serial","assetTag","description"].indexOf(tg.dataset.a)>-1){panel.confirm=false;const b=document.getElementById("dupBox");if(b)b.innerHTML=dupHTML(panel.draft,panel.addType)}return}
  if(id==="q"){if(tab==="equipment")S.f.q=e.target.value;else if(tab==="supplies")S.fs.q=e.target.value;else if(tab==="drives")S.fh.q=e.target.value;refreshList();save()}});
document.addEventListener("change",e=>{const id=e.target.id,v=e.target.value,tg=e.target;
  {
  if(id==="siteSel"){setSite(v);return}
  if(id==="cst"||id==="ctype"){S.fc[id==="cst"?"st":"type"]=v;save();certRows();return}
  if(id==="rmOverdue"){S.remind.overdue=tg.checked;save();render();return}
  if(id==="rmWeekly"){S.remind.weekly=tg.checked;save();render();return}
  if(id==="rmDay"){S.remind.weekDay=v;save();render();return}
  if(id==="rmTime"){S.remind.weekTime=v||"07:00";save();render();return}
  if(tg.dataset.g&&editor()){const g=S.groups.find(x=>x.id===tg.dataset.gid);if(g){g[tg.dataset.g]=v;save();toast("Saved. "+g.name+" now gets: "+WHEN_TXT[g.when].toLowerCase()+".")}return}
  if(id==="impType"){imp.type=v;return}
  if(id==="impSite"){imp.site=v;return}
  if(id==="impFile"){if(tg.files&&tg.files[0])impFile(tg.files[0]);tg.value="";return}
  if(id==="impSheet"){imp.sheet=v;impLoadRows(imp.file,imp.sheets[v],imp.sheets);return}
  if(tg.dataset.impMap!=null){imp.map[+tg.dataset.impMap]=v;render();return}
  if(tg.dataset.impRow!=null){const r=imp.checked[+tg.dataset.impRow];if(r&&!r.err)r.on=tg.checked;const b=document.querySelector("[data-imp-go]");const n=imp.checked.filter(x=>x.on).length;if(b){b.textContent="Import "+n+" row"+(n===1?"":"s")+" into "+siteById(imp.site).short;b.disabled=!n}return}
  if(id==="impOnly"){imp.only=tg.checked;render();return}
  }

  if(panel&&panel.kind==="report"&&tg.dataset.f){const k=tg.dataset.f;panel.draft[k]=tg.type==="checkbox"?tg.checked:v;
    if(k==="client"&&panel.type==="tr"){panel.draft.toName="Onboard "+v+" Representative";syncTr()}
    if(k==="job"&&panel.type==="tr"){panel.draft.no=nextNo("tr",panel.draft.date,v);const n=document.querySelector('[data-f="no"]');if(n)n.value=panel.draft.no}
    if(k==="itemId"||k==="client"||k==="date"||k==="job"||k==="dest"||k==="vessel"){const keep=document.querySelector(".sheet-b");const st=keep?keep.scrollTop:0;renderPanel();const nb=document.querySelector(".sheet-b");if(nb)nb.scrollTop=st}else updatePreview();return}
  if(panel&&panel.kind==="report"&&tg.dataset.pick){const ids=panel.draft.ids,i=ids.indexOf(tg.dataset.pick);if(tg.checked&&i<0)ids.push(tg.dataset.pick);if(!tg.checked&&i>-1)ids.splice(i,1);
    const c=document.getElementById("pickCount");if(c)c.textContent=ids.length+" selected";if(panel.type==="tr")syncTr();updatePreview();return}
  if(panel&&panel.kind==="add"&&tg.dataset.a){const k=tg.dataset.a;panel.draft[k]=tg.type==="checkbox"?tg.checked:v;
    if(k==="site"){const L=locsFor(v);if(L.indexOf(panel.draft.location)<0)panel.draft.location=L[Math.min(L.length-1,panel.addType==="sp"?3:0)]}
    if(k==="category"||k==="noSN"||k==="site"){const sb=document.querySelector(".sheet-b");const st=sb?sb.scrollTop:0;renderPanel();const nb=document.querySelector(".sheet-b");if(nb)nb.scrollTop=st}return}
  if(id==="addPhoto"){if(tg.files&&tg.files[0])decodeFile(tg.files[0],handleAddCode);tg.value="";return}
  if(id==="fcat")S.f.cat=v;else if(id==="fst")S.f.st=v;else if(id==="floc")S.f.loc=v;else if(id==="fkind")S.fs.kind=v;else if(id==="fhst")S.fh.st=v;
  else if(id==="labCat"){S.lab.cat=v;save();render();return}
  else if(id==="photo"){if(e.target.files&&e.target.files[0])scanPhoto(e.target.files[0]);e.target.value="";return}
  else return;save();refreshList()});
document.addEventListener("submit",e=>{
  {
  if(e.target.id==="dayForm"){e.preventDefault();const d=parseInt(document.getElementById("dayIn").value,10);if(isNaN(d)||d<0||d>365){toast("Enter a number of days from 0 to 365.");return}if(S.remind.days.indexOf(d)<0)S.remind.days.push(d);save();render();toast("Reminders now also go "+(d===0?"on the day":d+" days before expiry")+".");return}
  if(e.target.id==="grpForm"){e.preventDefault();const n=document.getElementById("gName").value.trim(),m=document.getElementById("gMail").value.trim();if(!n){toast("Give the group a name.");return}
    if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){toast("That email address doesn’t look right.");return}
    S.groups.push({id:"G"+(S.seq++),name:n,members:m?[m]:[],site:fleet()?"ALL":S.site,type:"ALL",when:"all"});save();render();toast("Group “"+n+"” added.");return}
  if(e.target.dataset&&e.target.dataset.gadd){e.preventDefault();const g=S.groups.find(x=>x.id===e.target.dataset.gadd);const inp=e.target.querySelector("input");const m=(inp.value||"").trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){toast("That email address doesn’t look right.");return}if(g.members.indexOf(m)<0)g.members.push(m);save();render();return}
  }
if(e.target.id==="nfForm"){e.preventDefault();const n=(document.getElementById("nfName").value||"").trim().replace(/[\\/]/g,"-");
    if(!n){toast("Type a folder name.");return}if(kidsOf(S.docFolder).some(f=>f.name.toLowerCase()===n.toLowerCase())){toast("There's already a folder called "+n+" here.");return}
    const f={id:"F"+(S.seq++),name:n,parent:S.docFolder,created:Date.now(),by:"You"};S.folders.push(f);newFolderOpen=false;save();render();toast("Folder “"+n+"” created.");return}
  if(e.target.id==="idForm"){e.preventDefault();const v=document.getElementById("idIn").value.trim().toUpperCase();
  const id=idFromCode(v)||idFromCode(v.replace(/^(EQ|SP|HD)-?(\d+)$/,(m,a,b)=>a+"-"+b.padStart(4,"0")));if(id)handleScan(id,"Opened");else toast("Enter an ID like EQ-0003, SP-0005 or HD-0017.")}});
document.getElementById("syncBtn").addEventListener("click",()=>{S.online=!S.online;save();
  if(S.online){toast("Back online.");doSync()}else toast("Offline mode (simulated). Keep working; changes wait on this device.");renderSync()});
document.getElementById("roleEditor").addEventListener("click",()=>{S.role="editor";save();render();refreshSheet()});
document.getElementById("roleViewer").addEventListener("click",()=>{S.role="viewer";save();if(panel&&panel.kind!=="doc")closeSheet();render();refreshSheet();toast("Viewing as read-only staff")});
const resetBtn=document.getElementById("resetBtn");let resetArm=false;
resetBtn.addEventListener("click",()=>{if(!resetArm){resetArm=true;resetBtn.textContent="Tap again to reset";setTimeout(()=>{resetArm=false;resetBtn.textContent="Reset demo data"},3000);return}
  resetArm=false;resetBtn.textContent="Reset demo data";S=build();seedDocs();save();closeSheet();render();toast("Demo data reset.")});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest(".dropzone");if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest(".dropzone");if(z)z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest(".dropzone");if(z){e.preventDefault();z.classList.remove("over");const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)impFile(f)}});
window.addEventListener("hashchange",()=>{readHash();render();window.scrollTo(0,0)});
setInterval(renderSync,30000);

(function(){const st=document.createElement("style");st.textContent=DOC_CSS;document.head.appendChild(st)})();
if(!S.folders||!S.folders.length){seedDocs();save()}
readHash();render();
if(S.online&&pending())scheduleSync();
})();
